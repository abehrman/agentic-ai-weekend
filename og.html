<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>OG card (render source, not a site page)</title>
<style>
  html, body { margin: 0; padding: 0; }
  .card {
    width: 1200px; height: 630px;
    box-sizing: border-box;
    background: #F5F1E8;
    color: #1F1D18;
    font-family: Georgia, "Times New Roman", serif;
    padding: 72px 80px;
    position: relative;
    border-left: 20px solid #1B4332;
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .top { display: flex; align-items: center; gap: 14px; }
  .wm { font-size: 30px; font-weight: 700; letter-spacing: -0.01em; }
  .wm .x { color: #1B4332; }
  .eyebrow {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 20px; letter-spacing: 0.10em; text-transform: uppercase;
    color: #123528; font-weight: 700;
  }
  h1 { font-size: 68px; line-height: 1.05; letter-spacing: -0.015em; margin: 0; max-width: 15ch; font-weight: 700; }
  .facts {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 26px; font-weight: 600; color: #1F1D18;
    font-variant-numeric: tabular-nums;
  }
  .facts .sep { color: #B07A2E; padding: 0 10px; }
  .tag {
    display: inline-block;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 20px; font-weight: 700; letter-spacing: 0.04em;
    color: #123528; background: #E7EEE8; border: 2px solid #123528;
    border-radius: 999px; padding: 8px 20px; margin-top: 10px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="top">
      <span class="wm">Agent<span class="x">X</span></span>
      <span class="eyebrow">Agentic AI Weekend · In-person AI intensive</span>
    </div>
    <div>
      <h1>Direct an agent that can help move real work forward.</h1>
      <div class="tag">No coding required</div>
    </div>
    <div class="facts">
      September 18&ndash;20, 2026 <span class="sep">/</span> Tenafly, New Jersey <span class="sep">/</span> Taught by Adam Behrman
    </div>
  </div>
</body>
</html>
