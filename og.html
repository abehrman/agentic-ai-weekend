<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1200, initial-scale=1">
  <title>AgentX AI Course social card</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 1200px; height: 630px; margin: 0; overflow: hidden; }
    body { display: grid; grid-template-columns: 56% 44%; background: #fff; color: #101010; font-family: Arial, Helvetica, sans-serif; }
    .copy { position: relative; padding: 48px 54px 44px; }
    .brand { display: flex; align-items: center; gap: 10px; font-size: 25px; font-weight: 800; letter-spacing: -1px; }
    .signal { width: 13px; height: 13px; background: #2b22fa; }
    .brand b { color: #2b22fa; }
    .eyebrow { margin: 54px 0 22px; color: #666; font-family: monospace; font-size: 14px; font-weight: 700; letter-spacing: 1.6px; text-transform: uppercase; }
    h1 { margin: 0; font-size: 74px; font-weight: 800; letter-spacing: -5.5px; line-height: .89; }
    h1 em { color: #2b22fa; font-style: normal; }
    .facts { position: absolute; right: 54px; bottom: 42px; left: 54px; display: flex; justify-content: space-between; padding-top: 18px; border-top: 1px solid #cfcfc8; font-family: monospace; font-size: 14px; font-weight: 700; text-transform: uppercase; }
    .photo { position: relative; overflow: hidden; background: #101010; }
    .photo img { width: 100%; height: 100%; object-fit: cover; object-position: 48% 46%; }
    .tag { position: absolute; top: 52px; left: -28px; padding: 14px 18px; background: #fff; border: 1px solid #101010; box-shadow: 7px 7px 0 #101010; font-family: monospace; font-size: 13px; font-weight: 700; }
    .tag::before { content: ""; display: inline-block; width: 8px; height: 8px; margin-right: 10px; background: #2b22fa; }
  </style>
</head>
<body>
  <section class="copy">
    <div class="brand"><span class="signal"></span><span>Agent<b>X</b> AI Course</span></div>
    <p class="eyebrow">Agentic AI Intensive · October cohort</p>
    <h1>Build your<br><em>second-brain.</em><br>Work with<br><em>superhuman</em> reach.</h1>
    <div class="facts"><span>Oct 5–27, 2026</span><span>Tenafly, NJ</span></div>
  </section>
  <section class="photo">
    <img src="assets/entrepreneur-workflow.png" alt="">
    <span class="tag">Nine live sessions</span>
  </section>
</body>
</html>
