<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>OG card (render source, not a site page)</title>
<style>
  html, body { margin: 0; padding: 0; }
  .card {
    width: 1200px; height: 630px;
    box-sizing: border-box;
    background: #111619;
    color: #F4F1E8;
    font-family: "Archivo SemiCondensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
    padding: 68px 80px;
    position: relative;
    display: flex; flex-direction: column; justify-content: space-between;
    overflow: hidden;
  }
  /* bench plane entering from the lower right */
  .bench { position: absolute; right: -40px; bottom: -60px; width: 720px; height: 360px;
    background: #28312F; transform: rotate(-6deg); border-top: 3px solid #B9C2BE; }
  .clamp { position: absolute; right: 470px; bottom: 150px; width: 34px; height: 26px; background: #E85D36; border-radius: 4px; }
  .stop { position: absolute; right: 96px; bottom: 150px; width: 10px; height: 78px; background: #E85D36; border-radius: 4px; }
  .stopbar { position: absolute; right: 96px; bottom: 220px; width: 84px; height: 10px; background: #E85D36; border-radius: 4px; }
  .top { display: flex; align-items: center; gap: 16px; position: relative; z-index: 2; }
  .mark { width: 22px; height: 22px; background: #E85D36; border-radius: 4px; }
  .wm { font-size: 30px; font-weight: 800; letter-spacing: 0.01em;
    font-family: "Archivo SemiCondensed", "Arial Narrow", system-ui, sans-serif; }
  .wm .x { color: #E85D36; }
  .eyebrow {
    font-size: 20px; letter-spacing: 0.14em; text-transform: uppercase;
    color: #E85D36; font-weight: 700;
  }
  h1 { font-size: 92px; line-height: 0.98; letter-spacing: -0.01em; margin: 0; font-weight: 800; position: relative; z-index: 2; }
  h1 span { display: block; }
  .facts {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 25px; font-weight: 600; color: #B9C2BE;
    font-variant-numeric: tabular-nums; position: relative; z-index: 2;
  }
  .facts .sep { color: #7FA7B8; padding: 0 12px; }
</style>
</head>
<body>
  <div class="card">
    <div class="bench"></div>
    <div class="clamp"></div>
    <div class="stopbar"></div>
    <div class="stop"></div>

    <div class="top">
      <span class="mark"></span>
      <span class="wm">Agent<span class="x">X</span></span>
      <span class="eyebrow">Agentic AI Weekend</span>
    </div>
    <div>
      <h1><span>Bring the work.</span><span>Direct the agent.</span><span>Keep the final say.</span></h1>
    </div>
    <div class="facts">
      September 18&ndash;20, 2026 <span class="sep">/</span> Tenafly, New Jersey <span class="sep">/</span> No coding required
    </div>
  </div>
</body>
</html>
