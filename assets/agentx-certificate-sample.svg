<svg xmlns="http://www.w3.org/2000/svg" width="11in" height="8.5in" viewBox="0 0 1400 1082" role="img" aria-labelledby="certificateTitle certificateDesc">
  <title id="certificateTitle">Sample AgentX AI Course Certificate of Completion for John Doe</title>
  <desc id="certificateDesc">A landscape certificate marked Sample, Not Valid. It records completion of the Agentic AI Intensive, October 5 through 27, 2026. The program comprises nine live sessions totaling 22.5 instructional hours. The demo credential ID is AX-2026-DEMO.</desc>
  <defs>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#101010" stroke-opacity=".045" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" x2="1">
      <stop offset="0" stop-color="#2b22fa" stop-opacity=".13"/>
      <stop offset="1" stop-color="#2b22fa" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1400" height="1082" fill="#ffffff"/>
  <rect x="34" y="34" width="1332" height="1014" fill="none" stroke="#101010" stroke-width="2"/>
  <rect x="58" y="58" width="1284" height="966" fill="url(#grid)" stroke="#dcdcd5" stroke-width="1"/>
  <rect x="58" y="58" width="14" height="966" fill="#2b22fa"/>
  <rect x="72" y="58" width="560" height="966" fill="url(#fade)"/>

  <g font-family="Arial, Helvetica, sans-serif" fill="#101010">
    <rect x="108" y="102" width="16" height="16" fill="#2b22fa"/>
    <text x="140" y="118" font-size="24" font-weight="700" letter-spacing="-1">Agent<tspan fill="#2b22fa">X</tspan> AI Course</text>
    <text x="1290" y="116" text-anchor="end" font-family="Consolas, monospace" font-size="13" font-weight="700" letter-spacing="1.8">SAMPLE • NOT VALID</text>
    <line x1="108" y1="154" x2="1292" y2="154" stroke="#101010" stroke-width="1"/>

    <text x="108" y="242" font-family="Consolas, monospace" font-size="16" font-weight="700" letter-spacing="2.5">CERTIFICATE OF COMPLETION</text>
    <text x="108" y="310" font-size="24" fill="#696969">Presented to</text>
    <text x="108" y="433" font-family="Arial Narrow, Arial, Helvetica, sans-serif" font-size="112" font-weight="800" letter-spacing="-5">JOHN DOE</text>
    <line x1="108" y1="466" x2="1020" y2="466" stroke="#101010" stroke-width="2"/>

    <text x="108" y="530" font-size="22" fill="#696969">for completing the</text>
    <text x="108" y="604" font-family="Arial Narrow, Arial, Helvetica, sans-serif" font-size="57" font-weight="800" letter-spacing="-2.3">Agentic AI Intensive</text>
    <text x="108" y="652" font-family="Consolas, monospace" font-size="15" font-weight="700" letter-spacing="1.1" fill="#2b22fa">PROGRAM FORMAT  /  NINE LIVE SESSIONS  /  22.5 INSTRUCTIONAL HOURS  /  OCTOBER 5–27, 2026</text>

    <text x="108" y="718" font-size="19" fill="#4f4f4f">Practical foundations in large language models, agents, agentic systems, tools,</text>
    <text x="108" y="746" font-size="19" fill="#4f4f4f">memory, verification, and human-approved workflows.</text>

    <g transform="translate(1112 246)">
      <rect x="0" y="0" width="136" height="136" fill="#101010"/>
      <text x="68" y="88" text-anchor="middle" font-family="Arial Narrow, Arial, sans-serif" font-size="62" font-weight="800" letter-spacing="-5" fill="#ffffff">AX</text>
      <rect x="16" y="16" width="18" height="18" fill="#2b22fa"/>
      <circle cx="119" cy="17" r="4" fill="#2b22fa"/>
      <circle cx="119" cy="34" r="4" fill="#ffffff" fill-opacity=".7"/>
      <circle cx="119" cy="51" r="4" fill="#ffffff" fill-opacity=".35"/>
    </g>

    <g opacity=".055" transform="translate(585 550) rotate(-12)">
      <text x="0" y="0" font-family="Arial Narrow, Arial, sans-serif" font-size="148" font-weight="800" letter-spacing="7" fill="#2b22fa">SAMPLE</text>
    </g>

    <line x1="108" y1="820" x2="1292" y2="820" stroke="#101010" stroke-width="1"/>
    <text x="108" y="862" font-family="Consolas, monospace" font-size="11" font-weight="700" letter-spacing="1.3" fill="#696969">ISSUED</text>
    <text x="108" y="891" font-size="17" font-weight="700">October 27, 2026 · Tenafly, New Jersey</text>

    <text x="563" y="862" font-family="Consolas, monospace" font-size="11" font-weight="700" letter-spacing="1.3" fill="#696969">CREDENTIAL ID</text>
    <text x="563" y="891" font-family="Consolas, monospace" font-size="17" font-weight="700">AX-2026-DEMO</text>

    <line x1="976" y1="900" x2="1292" y2="900" stroke="#101010" stroke-width="1"/>
    <text x="976" y="928" font-size="16" font-weight="700">Adam Behrman</text>
    <text x="1292" y="928" text-anchor="end" font-size="14" fill="#696969">Instructor &amp; Issuer</text>

    <rect x="108" y="963" width="1184" height="2" fill="#2b22fa"/>
    <text x="108" y="997" font-family="Consolas, monospace" font-size="12" font-weight="700" letter-spacing="1.1">AGENTXAICOURSE.COM</text>
    <text x="1292" y="997" text-anchor="end" font-family="Consolas, monospace" font-size="12" font-weight="700" letter-spacing="1.1">ISSUED BY AGENTX AI COURSE</text>
  </g>
</svg>
